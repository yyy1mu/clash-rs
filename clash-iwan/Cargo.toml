[package]
name = "clash-iwan"
version.workspace = true
edition = "2021"

[dependencies]
tempfile = "3"
libc = "0.2"
md-5 = "0.10"
aes = "0.8"
cipher = "0.4"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
anyhow = "1"
ureq = { version = "2", features = ["json"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
tokio = { version = "1", features = ["full"] }
smoltcp = { version = "0.13", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }
