name: Verge service core tooling
on:
  pull_request:
    paths:
      - 'scripts/verge-service-core.py'
      - 'scripts/tests/test_verge_service_core.py'
      - '.github/workflows/verge-service-core.yml'
  workflow_dispatch:
jobs:
  offline-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts/tests -v
      - run: python -m py_compile scripts/verge-service-core.py scripts/tests/test_verge_service_core.py scripts/test-verge-reload.py
      - run: git diff --check
